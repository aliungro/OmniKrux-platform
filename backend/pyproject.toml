[project]
name = "omnikrux"
version = "0.1.0"
description = "Omnikrux: web console for Kubernetes and multicloud"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "kubernetes_asyncio>=31",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "cryptography>=43",
    "pyyaml>=6",
    "botocore>=1.35",
    "google-auth>=2.30",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omnikrux"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = ["kind: needs a running kind cluster"]
# Temporary: drop once starlette stops triggering the httpx deprecation warning.
filterwarnings = [
    "ignore:Using `httpx` with:Warning",
]
