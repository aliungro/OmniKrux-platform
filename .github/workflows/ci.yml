name: CI

# Manual only for now: run it from the Actions tab (Run workflow) on any branch.
# To run it on every pull request later, add `pull_request:` and `push: { branches: [main] }` here.
on:
  workflow_dispatch:

# Read only: pull requests from forks get no write access and no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.13.7
      - name: Install dependencies
        run: python -m uv sync --frozen
      - name: Lint
        run: python -m uv run --frozen ruff check .
      - name: Format
        run: python -m uv run --frozen ruff format --check .
      - name: Tests
        run: python -m uv run --frozen pytest -q -m "not kind and not cloud_live"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm test
      - name: Build and startup size check
        run: npm run build
      - name: Startup check's own test
        run: node --test scripts/check-startup-bundle.node.mjs
