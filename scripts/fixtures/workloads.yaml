# Demo workloads for the kind dev cluster (scripts/dev-kind.sh).
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
# Restarts forever: CrashLoopBackOff.
apiVersion: v1
kind: Pod
metadata:
  name: crasher
  namespace: demo
spec:
  restartPolicy: Always
  containers:
    - name: crasher
      image: busybox:1.36
      command: ["sh", "-c", "echo boom; exit 1"]
---
# Requests more CPU than any node has: stays Pending.
apiVersion: v1
kind: Pod
metadata:
  name: stuck
  namespace: demo
spec:
  containers:
    - name: stuck
      image: busybox:1.36
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: "64"
---
# Prints "tick N" every 0.2 s.
apiVersion: v1
kind: Pod
metadata:
  name: logger
  namespace: demo
spec:
  restartPolicy: Always
  containers:
    - name: logger
      image: busybox:1.36
      command: ["sh", "-c", "i=0; while true; do i=$((i+1)); echo tick $i; sleep 0.2; done"]
---
# Allocates past its memory limit: OOMKilled, restarts forever.
apiVersion: v1
kind: Pod
metadata:
  name: oom
  namespace: demo
spec:
  restartPolicy: Always
  containers:
    - name: oom
      image: busybox:1.36
      command: ["sh", "-c", "head -c 200m /dev/zero | tail"]
      resources:
        limits:
          memory: 32Mi
