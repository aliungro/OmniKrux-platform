# Demo workloads for the kind dev cluster (scripts/dev-kind.sh).
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
# Restarts forever: CrashLoopBackOff.
apiVersion: v1
kind: Pod
metadata:
  name: crasher
  namespace: demo
spec:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  restartPolicy: Always
  containers:
    - name: crasher
      image: busybox:1.36
      command: ["sh", "-c", "echo boom; exit 1"]
---
# Two ready regular containers; the completed init container is left out of the row.
apiVersion: v1
kind: Pod
metadata:
  name: two-containers
  namespace: demo
spec:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  initContainers:
    - name: prepare
      image: busybox:1.36
      command: ["true"]
  containers:
    - name: web
      image: nginx:1.27
    - name: helper
      image: busybox:1.36
      command: ["sleep", "3600"]
---
# Requests more CPU than any node has: stays Pending.
apiVersion: v1
kind: Pod
metadata:
  name: stuck
  namespace: demo
spec:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: stuck
      image: busybox:1.36
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: "64"
---
# Prints "tick N" every 0.2 s.
apiVersion: v1
kind: Pod
metadata:
  name: logger
  namespace: demo
spec:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  restartPolicy: Always
  containers:
    - name: logger
      image: busybox:1.36
      command: ["sh", "-c", "i=0; while true; do i=$((i+1)); echo tick $i; sleep 0.2; done"]
---
# Allocates past its memory limit: OOMKilled, restarts forever.
apiVersion: v1
kind: Pod
metadata:
  name: oom
  namespace: demo
spec:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  restartPolicy: Always
  containers:
    - name: oom
      image: busybox:1.36
      command: ["sh", "-c", "head -c 200m /dev/zero | tail"]
      resources:
        limits:
          memory: 32Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: demo
data:
  greeting: hello
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: demo
type: Opaque
stringData:
  password: s3cr3t-omnikrux
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.omnikrux.dev
spec:
  group: example.omnikrux.dev
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: integer
      additionalPrinterColumns:
        - name: Size
          type: integer
          jsonPath: .spec.size
---
apiVersion: example.omnikrux.dev/v1
kind: Widget
metadata:
  name: sprocket
  namespace: demo
spec:
  size: 3
---
# Lives on the labelled worker and is protected by a PodDisruptionBudget: a drain of the
# worker can't evict it (the drain test's blocked pod).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guarded
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guarded
  template:
    metadata:
      labels:
        app: guarded
    spec:
      nodeSelector:
        omnikrux.dev/drain-test: "true"
      containers:
        - name: sleeper
          image: busybox:1.36
          command: ["sleep", "infinity"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: guarded
  namespace: demo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: guarded
