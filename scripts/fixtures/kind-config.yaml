# The kind cluster "omnikrux-dev" (scripts/dev-kind.sh): one control plane and one worker.
# The worker is the only node the drain tests may cordon and drain.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
    labels:
      omnikrux.dev/drain-test: "true"
