<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-labelledby="title desc">
<title id="title">OmniKrux</title>
<desc id="desc">The OmniKrux mark turning slowly, and the name omni::krux typing itself out. One place for everything.</desc>
<style>
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .flow { animation: flow 6s linear infinite; }
  @keyframes flow { to { transform: translateX(522.31px); } }
  .sep { animation: pulse 2.4s ease-in-out infinite; }
  .sep-glow { opacity: 0; animation: glow 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
  @keyframes glow { 0%, 100% { opacity: 0; } 50% { opacity: 0.95; } }
  .type { animation: type 1.6s 0.3s both; animation-timing-function: step-end; }
  @keyframes type { 0.00% { transform: translateX(0.00px); } 10.00% { transform: translateX(64.01px); } 20.00% { transform: translateX(162.96px); } 30.00% { transform: translateX(226.72px); } 40.00% { transform: translateX(250.82px); } 50.00% { transform: translateX(272.66px); } 60.00% { transform: translateX(288.62px); } 70.00% { transform: translateX(357.76px); } 80.00% { transform: translateX(401.69px); } 90.00% { transform: translateX(464.44px); } 100.00% { transform: translateX(522.31px); } }
  .caret { animation: blink 1s steps(2, jump-none) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .tag { animation: fade 0.8s ease-out 1.9s both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .spin, .flow, .sep, .sep-glow, .caret, .tag { animation: none; }
    .sep { opacity: 1; }
    .type { animation: none; transform: translateX(522.31px); }
  }
</style>
